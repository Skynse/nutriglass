[project]
name = "eater"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Austin", email = "prodbyskynse@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "peft>=0.21.3",
    "pillow>=12.3.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "ultralytics>=8.4.216",
]

[project.scripts]
eater = "eater:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
]
